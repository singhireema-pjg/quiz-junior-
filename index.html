<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Ripple Effect — Junior Thinkers Quiz</title>
<style>
html,body{margin:0;background:#111;min-height:100%;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
#stage{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#111}
#canvas{position:relative;width:min(100vw,177.58vh);height:min(100vh,56.25vw);overflow:hidden;background:#f5f5e8}
#slideImg{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.hot{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:8px;transition:.15s;}
.hot:hover{background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 3px rgba(27,116,65,.28)}
.hot.sel{background:rgba(27,116,65,.13);box-shadow:inset 0 0 0 4px rgba(27,116,65,.65)}
#controls{position:absolute;left:0;right:0;bottom:0;height:62px;display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:0 22px;background:linear-gradient(transparent,rgba(0,0,0,.55));z-index:20}
.ctrl{border:0;border-radius:10px;padding:10px 17px;font-weight:700;cursor:pointer;background:white;color:#1b3a2b;font-size:14px}
.ctrl.dark{background:#1b743f;color:#fff}
#feedback{position:absolute;left:50%;transform:translateX(-50%);bottom:76px;z-index:30;background:white;border-radius:12px;padding:11px 17px;box-shadow:0 8px 25px rgba(0,0,0,.2);font-weight:700;color:#1b3a2b;display:none;max-width:70%;text-align:center}
#progress{position:absolute;top:14px;right:18px;z-index:25;background:rgba(255,255,255,.92);color:#1b3a2b;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800;display:none}
@media(max-width:700px){#controls{height:54px}.ctrl{font-size:12px;padding:8px 12px}#feedback{bottom:62px;font-size:12px}}
</style></head><body>
<div id="stage"><div id="canvas"><img id="slideImg"><div id="progress"></div><div id="feedback"></div><div id="hotspots"></div><div id="controls"></div></div></div>
<script>
const slides=[{"kind": "start", "img": "slide-01.webp"}, {"kind": "instructions", "img": "slide-02.webp"}, {"kind": "question", "num": 1, "img": "slide-03.webp"}, {"kind": "answer", "num": 1, "img": "slide-04.webp"}, {"kind": "question", "num": 2, "img": "slide-05.webp"}, {"kind": "answer", "num": 2, "img": "slide-06.webp"}, {"kind": "question", "num": 3, "img": "slide-07.webp"}, {"kind": "answer", "num": 3, "img": "slide-08.webp"}, {"kind": "question", "num": 4, "img": "slide-09.webp"}, {"kind": "answer", "num": 4, "img": "slide-10.webp"}, {"kind": "question", "num": 5, "img": "slide-11.webp"}, {"kind": "answer", "num": 5, "img": "slide-12.webp"}, {"kind": "question", "num": 6, "img": "slide-13.webp"}, {"kind": "answer", "num": 6, "img": "slide-14.webp"}, {"kind": "question", "num": 7, "img": "slide-15.webp"}, {"kind": "answer", "num": 7, "img": "slide-16.webp"}, {"kind": "question", "num": 8, "img": "slide-17.webp"}, {"kind": "answer", "num": 8, "img": "slide-18.webp"}, {"kind": "question", "num": 9, "img": "slide-19.webp"}, {"kind": "answer", "num": 9, "img": "slide-20.webp"}, {"kind": "question", "num": 10, "img": "slide-21.webp"}, {"kind": "answer", "num": 10, "img": "slide-22.webp"}];
const meta={"1": {"type": "single", "hotspots": [[54, 386, 452, 552, "A"], [468, 386, 866, 552, "B"], [54, 570, 452, 736, "C"], [468, 570, 866, 736, "D"]], "answer": ["D"]}, "2": {"type": "multi", "hotspots": [[54, 354, 452, 488, "A"], [468, 354, 866, 488, "B"], [54, 503, 452, 638, "C"], [468, 503, 866, 638, "D"]], "answer": ["A", "C", "D"]}, "3": {"type": "single", "hotspots": [[54, 354, 452, 488, "A"], [468, 354, 866, 488, "B"], [54, 503, 452, 638, "C"], [468, 503, 866, 638, "D"]], "answer": ["B"]}, "4": {"type": "tf", "hotspots": [[518, 502, 936, 616, "True"], [970, 502, 1388, 616, "False"]], "answer": ["True"]}, "5": {"type": "single", "hotspots": [[54, 386, 452, 552, "A"], [468, 386, 866, 552, "B"], [54, 570, 452, 736, "C"], [468, 570, 866, 736, "D"]], "answer": ["C"]}, "6": {"type": "multi", "hotspots": [[54, 386, 452, 552, "A"], [468, 386, 866, 552, "B"], [54, 570, 452, 736, "C"], [468, 570, 866, 736, "D"]], "answer": ["A", "B", "C"]}, "7": {"type": "single", "hotspots": [[54, 386, 452, 552, "A"], [468, 386, 866, 552, "B"], [54, 570, 452, 736, "C"], [468, 570, 866, 736, "D"]], "answer": ["D"]}, "8": {"type": "tf", "hotspots": [[518, 502, 936, 616, "True"], [970, 502, 1388, 616, "False"]], "answer": ["False"]}, "9": {"type": "single", "hotspots": [[54, 386, 452, 552, "A"], [468, 386, 866, 552, "B"], [54, 570, 452, 736, "C"], [468, 570, 866, 736, "D"]], "answer": ["A"]}, "10": {"type": "single", "hotspots": [[54, 386, 452, 552, "A"], [468, 386, 866, 552, "B"], [54, 570, 452, 736, "C"], [468, 570, 866, 736, "D"]], "answer": ["A"]}};
const qdata=[{"num": 1, "type": "single", "answer": ["D"], "explain": "Spending too long on one choice can leave less time for the important work."}, {"num": 2, "type": "multi", "answer": ["A", "C", "D"], "explain": "Waiting can create pressure, rushing, and fewer chances to improve the model."}, {"num": 3, "type": "single", "answer": ["B"], "explain": "Testing more than once helps us learn whether something works reliably."}, {"num": 4, "type": "tf", "answer": ["True"], "explain": "Small choices can create a ripple effect, leading to bigger changes later."}, {"num": 5, "type": "single", "answer": ["C"], "explain": "Find out why the model stops before spending time on extra features or decoration."}, {"num": 6, "type": "multi", "answer": ["A", "B", "C"], "explain": "The child may become tired, the project may depend too much on one person, and others may get fewer chances to help."}, {"num": 7, "type": "single", "answer": ["D"], "explain": "Before choosing a solution, first identify what is actually causing the problem."}, {"num": 8, "type": "tf", "answer": ["False"], "explain": "One successful result does not guarantee that the same plan will work every time."}, {"num": 9, "type": "single", "answer": ["A"], "explain": "Your planned purchases cost ₹40, so check whether buying the ₹20 toy would leave enough money for them."}, {"num": 10, "type": "single", "answer": ["A"], "explain": "Changing a rule can affect everyone, so fairness should be considered first."}];
let slide=0,currentQ=0,selected=[] ,score=0,checked=false;
const img=document.getElementById('slideImg'),hs=document.getElementById('hotspots'),controls=document.getElementById('controls'),feedback=document.getElementById('feedback'),progress=document.getElementById('progress');
function setSlide(i){slide=i;img.src=slides[i].img;hs.innerHTML='';feedback.style.display='none';controls.innerHTML='';progress.style.display='none';
 if(slides[i].kind==='start'){controls.innerHTML='<button class="ctrl dark" onclick="go(1)">START QUIZ →</button>';return}
 if(slides[i].kind==='instructions'){controls.innerHTML='<button class="ctrl dark" onclick="go(2)">BEGIN →</button>';return}
 if(slides[i].kind==='question'){currentQ=slides[i].num;checked=false;selected=[];progress.textContent='Question '+currentQ+' of 10';progress.style.display='block';renderHotspots(currentQ);controls.innerHTML='<button class="ctrl" onclick="go('+({1:2,2:4,3:6,4:8,5:10,6:12,7:14,8:16,9:18,10:20})[currentQ]+')">RESET</button><button class="ctrl dark" onclick="check()">CHECK ANSWER</button>';}
 if(slides[i].kind==='answer'){currentQ=slides[i].num;progress.textContent='Answer '+currentQ+' of 10';progress.style.display='block';let next=currentQ<10?({1:4,2:6,3:8,4:10,5:12,6:14,7:16,8:18,9:20,10:22})[currentQ]:22;controls.innerHTML='<button class="ctrl dark" onclick="go('+next+')">'+(currentQ<10?'NEXT QUESTION →':'SEE RESULT →')+'</button>';}
}
function renderHotspots(n){const m=meta[n];m.hotspots.forEach((r)=>{let b=document.createElement('button');b.className='hot';b.style.left=(r[0]/1465*100)+'%';b.style.top=(r[1]/825*100)+'%';b.style.width=((r[2]-r[0])/1465*100)+'%';b.style.height=((r[3]-r[1])/825*100)+'%';b.onclick=()=>select(r[4],b);hs.appendChild(b)})}
function select(v,b){if(checked)return;let m=meta[currentQ];if(m.type==='multi'){if(selected.includes(v))selected=selected.filter(x=>x!==v);else selected.push(v)}else selected=[v];document.querySelectorAll('.hot').forEach(x=>x.classList.remove('sel'));selected.forEach(s=>document.querySelectorAll('.hot').forEach(x=>{}));meta[currentQ].hotspots.forEach((r,i)=>{if(selected.includes(r[4]))document.querySelectorAll('.hot')[i].classList.add('sel')})}
function check(){if(checked)return;if(!selected.length){feedback.textContent='Please choose an answer first.';feedback.style.display='block';return}let correct=meta[currentQ].answer.slice().sort().join('|')===selected.slice().sort().join('|');checked=true;if(correct)score++;feedback.textContent=correct?'✓ Correct! Click NEXT QUESTION to see the explanation.':'Not quite — click NEXT QUESTION to see the explanation.';feedback.style.display='block';setTimeout(()=>{let ai={1:3,2:5,3:7,4:9,5:11,6:13,7:15,8:17,9:19,10:21}[currentQ];go(ai)},900)}
function go(i){setSlide(i)}
// Result
function result(){img.src='slide-23.webp';hs.innerHTML='';progress.style.display='none';feedback.style.display='none';controls.innerHTML='<button class="ctrl dark" onclick="location.reload()">TRY AGAIN ↻</button>';setTimeout(()=>{
 const c=document.createElement('div');c.style.position='absolute';c.style.left='46%';c.style.top='45%';c.style.transform='translate(-50%,-50%)';c.style.color='#1b743f';c.style.fontWeight='800';c.style.fontSize='42px';c.textContent=score+' / 10';c.style.zIndex='10';document.getElementById('canvas').appendChild(c);
},20)}
// intercept result slide index 22
const oldGo=go;go=function(i){if(i===22){result();return}oldGo(i)};
setSlide(0);
</script></div></body></html>
